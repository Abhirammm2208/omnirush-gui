# Temporary: compiles and tests the macOS computer use helper on this branch (removed before merge).
name: Computer use helper (Swift)
on:
  push:
    branches: [feat/computer-use-gui]
    paths:
      - "packages/computer-use/native/**"
      - ".github/workflows/computer-use-swift-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build
        working-directory: packages/computer-use/native
        run: swift build
      - name: Test
        working-directory: packages/computer-use/native
        run: swift test || swift test
