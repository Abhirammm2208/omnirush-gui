name: Changelog

# The release workflow publishes releases with GITHUB_TOKEN, and GitHub never
# starts workflows from events created by that token, so `release: published`
# only fires when a human publishes by hand. The primary entry point is the
# `gh workflow run changelog.yml -f tag=...` dispatch issued by
# release-macos-aarch64.yml right after it flips the draft.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to document (e.g. v0.18.13)
        required: true
        type: string

# The changelog agent runs model-driven commands, so it is isolated in its own
# job: read-only token, no persisted git credentials, no signing key, and
# nothing it writes reaches a later step except its two output files. A
# separate job on a fresh runner applies those files to a clean checkout of
# the same base commit, verifies them with that commit's checker, then signs,
# pushes, and updates the release.
permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BASE_BRANCH: dev
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    if: github.repository == 'omnirush-ai/omnirush-gui'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.guard.outputs.stable }}
      documented: ${{ steps.dedupe.outputs.documented }}
      base_sha: ${{ steps.base.outputs.sha }}
      prev: ${{ steps.facts.outputs.prev }}
      tracker_file: ${{ steps.facts.outputs.tracker_file }}

    steps:
      - name: Validate tag
        id: guard
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping changelog automation because $TAG is not a stable release tag."
          fi

      - name: Checkout
        if: steps.guard.outputs.stable == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      # Later jobs check out exactly this commit, even if the branch moves.
      - name: Pin the base commit
        if: steps.guard.outputs.stable == 'true'
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip if already documented
        if: steps.guard.outputs.stable == 'true'
        id: dedupe
        run: |
          if grep -Fq "[$TAG](https://github.com/omnirush-ai/omnirush-gui/compare/" packages/docs/changelog.mdx; then
            echo "documented=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already documented; skipping docs generation and only refreshing the release notes."
          else
            echo "documented=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather release facts
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        id: facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_AT_EVENT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Release tag $TAG does not exist in the fetched repository." >&2
            exit 1
          fi

          PREV="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -x -B1 "$TAG" | head -n1)"
          if [[ -z "$PREV" || "$PREV" == "$TAG" ]]; then
            echo "Could not determine the stable release immediately before $TAG." >&2
            exit 1
          fi

          PUBLISHED_AT="$PUBLISHED_AT_EVENT"
          if [[ -z "$PUBLISHED_AT" ]]; then
            PUBLISHED_AT="$(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          fi
          if [[ -z "$PUBLISHED_AT" ]]; then
            echo "Could not determine the published-at timestamp for $TAG." >&2
            exit 1
          fi

          COMMIT8="$(git rev-list -n1 "$TAG" | cut -c1-8)"
          SHORTSTAT="$(git diff --shortstat "$PREV".."$TAG")"
          INSERTIONS="$(grep -oE '[0-9]+ insertion' <<< "$SHORTSTAT" | grep -oE '[0-9]+' || true)"
          DELETIONS="$(grep -oE '[0-9]+ deletion' <<< "$SHORTSTAT" | grep -oE '[0-9]+' || true)"
          INSERTIONS="${INSERTIONS:-0}"
          DELETIONS="${DELETIONS:-0}"
          TOTAL=$((INSERTIONS + DELETIONS))
          LOC_LINE="$TOTAL lines changed since \`$PREV\` ($INSERTIONS insertions, $DELETIONS deletions)."

          IFS=$'\t' read -r DATE_LABEL TRACKER_FILE < <(node -e '
            const publishedAt = new Date(process.argv[1]);
            if (Number.isNaN(publishedAt.valueOf())) throw new Error("Invalid published-at timestamp");
            const day = publishedAt.getUTCDate();
            const mod100 = day % 100;
            const suffix = mod100 >= 11 && mod100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[day % 10] || "th");
            const month = publishedAt.toLocaleString("en-US", { month: "long", timeZone: "UTC" });
            const date = publishedAt.toISOString().slice(0, 10);
            process.stdout.write(month + " " + day + suffix + "\tchangelog/release-tracker-" + date + ".md\n");
          ' "$PUBLISHED_AT")

          prompt_dir="$RUNNER_TEMP/changelog-prompt"
          mkdir -p "$prompt_dir"
          git log --no-merges --format='%h %s' "$PREV".."$TAG" | head -400 > /tmp/commits.txt
          cat > "$prompt_dir/changelog_prompt.txt" <<PROMPT_EOF
          Document OmniRush.ai release $TAG in the changelog. Use these facts exactly; do not invent or recompute any of them.

          - version: $TAG
          - previous version: $PREV
          - release commit (short): $COMMIT8
          - published at (UTC): $PUBLISHED_AT
          - docs date label: $DATE_LABEL
          - tracker file: $TRACKER_FILE
          - loc line (copy verbatim into the tracker): $LOC_LINE
          - compare url: https://github.com/omnirush-ai/omnirush-gui/compare/$PREV...$TAG

          Commits between $PREV and $TAG (hash subject):
          PROMPT_EOF
          cat /tmp/commits.txt >> "$prompt_dir/changelog_prompt.txt"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "tracker_file=$TRACKER_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload the agent prompt
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-prompt
          path: ${{ runner.temp }}/changelog-prompt/changelog_prompt.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Untrusted: everything after the agent starts in this job is treated as
  # compromised. Read-only token, no credentials on disk, no secrets but the
  # model key.
  draft:
    needs: prepare
    if: needs.prepare.outputs.stable == 'true' && needs.prepare.outputs.documented == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TRACKER_FILE: ${{ needs.prepare.outputs.tracker_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the agent prompt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-prompt
          path: ${{ runner.temp }}/changelog-prompt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install opencode
        run: |
          version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$version" --no-modify-path

      - name: Draft changelog entries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: opencode run --agent changelog "$(cat "$RUNNER_TEMP/changelog-prompt/changelog_prompt.txt")"

      # Only these two files leave the job; the publish job validates them again.
      - name: Collect the drafted files
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/changelog-output"
          mkdir -p "$out/packages/docs" "$out/changelog"
          for file in packages/docs/changelog.mdx "$TRACKER_FILE"; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "The changelog agent did not leave a regular file at $file." >&2
              exit 1
            fi
            cp "$file" "$out/$file"
          done

      - name: Upload the drafted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-draft
          path: ${{ runner.temp }}/changelog-output
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Trusted: a fresh runner the agent never ran on, checked out at the pinned
  # base commit, so the checker and release scripts are the reviewed ones.
  publish:
    needs: [prepare, draft]
    if: >-
      always()
      && needs.prepare.outputs.stable == 'true'
      && (needs.prepare.outputs.documented == 'true' || needs.draft.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PREV: ${{ needs.prepare.outputs.prev }}
      TRACKER_FILE: ${{ needs.prepare.outputs.tracker_file }}
      DOCUMENTED: ${{ needs.prepare.outputs.documented }}
      BRANCH_NAME: automation/changelog-${{ github.event.release.tag_name || inputs.tag }}-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          # Only reviewed scripts from the base commit run in this job.
          persist-credentials: true

      - name: Download the drafted files
        if: env.DOCUMENTED == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-draft
          path: ${{ runner.temp }}/changelog-draft

      - name: Apply the drafted files
        if: env.DOCUMENTED == 'false'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/changelog-draft"
          expected="$(printf '%s\n' "changelog/${TRACKER_FILE#changelog/}" packages/docs/changelog.mdx | sort)"
          actual="$(cd "$src" && find . -mindepth 1 \( -type f -o -type l \) -printf '%P\n' | sort)"
          if [[ "$actual" != "$expected" ]] || find "$src" -type l | grep -q .; then
            echo "The drafted artifact must hold exactly packages/docs/changelog.mdx and $TRACKER_FILE as regular files." >&2
            printf 'Found:\n%s\n' "$actual" >&2
            exit 1
          fi
          install -m 0644 "$src/packages/docs/changelog.mdx" packages/docs/changelog.mdx
          install -m 0644 "$src/$TRACKER_FILE" "$TRACKER_FILE"

      - name: Verify generated output
        if: env.DOCUMENTED == 'false'
        run: node scripts/check-changelog-output.mjs "$TAG" "$PREV"

      - name: Commit release notes
        if: env.DOCUMENTED == 'false'
        env:
          COMMIT_SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail

          signing_key="$RUNNER_TEMP/commit-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          umask 077
          printf '%s\n' "$COMMIT_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"

          git config --local user.email "11430621+benjaminshafii@users.noreply.github.com"
          git config --local user.name "benjaminshafii"
          git config --local gpg.format ssh
          git config --local user.signingkey "$signing_key"
          git switch -c "$BRANCH_NAME"
          git add packages/docs/changelog.mdx changelog/
          git commit -S -m "docs(changelog): release notes for $TAG"

      - name: Open pull request
        if: env.DOCUMENTED == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git push --set-upstream origin "$BRANCH_NAME"
          printf '%s\n\n%s\n' \
            "These release notes were auto-generated from the commits between \`$PREV\` and \`$TAG\` by the changelog agent and verified by \`scripts/check-changelog-output.mjs\`." \
            "This is a docs-only change with no runtime surface." > /tmp/pr_body.txt
          pr_url="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "docs(changelog): release notes for $TAG" \
            --body-file /tmp/pr_body.txt)"
          gh pr merge "$pr_url" --auto --squash --delete-branch

      # Runs for already-documented tags too, so a manual dispatch can repair a
      # release whose notes were hand-written or whose original dispatch failed.
      - name: Update GitHub Release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "$TAG" --json body -q .body > /tmp/existing_release_body.md
          node scripts/release/release-notes-from-changelog.mjs "$TAG" \
            --existing-body /tmp/existing_release_body.md > /tmp/release_notes.md
          gh release edit "$TAG" --notes-file /tmp/release_notes.md
          echo "Replaced the static release body of $TAG with the generated changelog entry."
