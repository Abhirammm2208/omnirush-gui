# The OmniRush VM's boot (inside the standalone GRUB that box/vm/build-image.sh makes): the root
# by its label, the kernel and initrd the image was built with, the console on Lima's serial (hvc0).
set timeout=0
search --no-floppy --label omnirush-root --set=root
linux /boot/vmlinuz-@KVER@ root=LABEL=omnirush-root ro console=hvc0 console=tty0
initrd /boot/initrd.img-@KVER@
boot
